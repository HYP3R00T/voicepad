[project]
name = "voicepad-core"
version = "0.1.0"
description = "Core audio processing for Voicepad."
readme = "README.md"
authors = [{ name = "Rajesh Das", email = "rajesh@hyperoot.dev" }]
requires-python = ">=3.13"
dependencies = [
  "faster-whisper>=1.2.1",
  "pydantic>=2.0.0",
  "sounddevice>=0.5.5",
  "soundfile>=0.13.1",
  "utilityhub-config>=0.2.0",
]

[project.scripts]
voicepad-core = "voicepad_core.main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
