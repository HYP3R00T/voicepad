[project]
name = "voicepad-core"
version = "0.2.1"
description = "Audio and local transcription pipeline primitives for VoicePad."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Rajesh Das", email = "hyperoot.tech@proton.me" }]
keywords = [
  "audio",
  "audio-processing",
  "gpu-acceleration",
  "recording",
  "speech-recognition",
  "speech-to-text",
  "transcription",
  "voice",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "accelerate==1.14.0",
  "huggingface-hub==1.26.0",
  "librosa==0.11.0",
  "numpy>=2.0.0",
  "onnxruntime==1.28.0",
  "scipy>=1.17.0",
  "sounddevice>=0.5.5",
  "soundfile>=0.13.1",
  "torch==2.13.0",
  "transformers==5.14.1",
]

[project.urls]
Documentation = "https://hyp3r00t.github.io/voicepad/"
HomePage = "https://hyp3r00t.github.io/voicepad/"
Issues = "https://github.com/HYP3R00T/voicepad/issues"
Repository = "https://github.com/HYP3R00T/voicepad"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
