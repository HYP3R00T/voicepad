[project]
name = "voicepad-core"
version = "0.1.1"
description = "Core audio processing for Voicepad."
readme = "README.md"
authors = [{ name = "Rajesh Das", email = "rajesh@hyperoot.dev" }]
requires-python = ">=3.13"
license = "MIT"
keywords = [
  "audio",
  "transcription",
  "voice",
  "whisper",
  "speech-to-text",
  "recording",
  "faster-whisper",
  "gpu-acceleration",
  "speech-recognition",
  "audio-processing",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "faster-whisper>=1.2.1",
  "psutil>=7.2.2",
  "pydantic>=2.0.0",
  "sounddevice>=0.5.5",
  "soundfile>=0.13.1",
  "utilityhub-config>=0.2.0",
]

[project.urls]
HomePage = "https://hyp3r00t.github.io/voicepad/"
Repository = "https://github.com/HYP3R00T/voicepad"
Issues = "https://github.com/HYP3R00T/voicepad/issues"
Documentation = "https://hyp3r00t.github.io/voicepad/"

[project.optional-dependencies]
gpu = [
  # CUDA 12.x libraries for GPU acceleration (NVIDIA only, Windows/Linux)
  # These are installed in virtual environment, no system conflicts
  # Compatible with all NVIDIA GPUs from GTX 10-series to RTX 50-series
  "nvidia-cublas-cu12>=12.0.0,<13.0.0",
  "nvidia-cudnn-cu12>=9.0.0,<10.0.0",
]

[project.scripts]
voicepad-core = "voicepad_core.main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
