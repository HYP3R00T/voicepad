[tools]
git-cliff = "latest"
prek = "latest"
node = "lts"
pnpm = "latest"
python = "3.14"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"
uv = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
lockfile = true

[settings.github]
use_git_credentials = true

[hooks]
enter = ["bash ./scripts/enter_project.sh"]

[env]
_.file = ".env"  # for sensitive data
UV_LINK_MODE = "copy"

[tasks.docs]
run = "pnpm --dir docs dev"
description = "Serve the Astro documentation locally"

[tasks.docs-build]
run = "pnpm --dir docs build"
description = "Type-check and build the Astro documentation"

[tasks.sync]
run = "uv sync --upgrade"
description = "Sync dependencies"

[tasks.test]
run = "pytest packages --cov=voicepad --cov=voicepad_core --cov-fail-under=70"
description = "Run all tests (GPU tests skipped by default, 70% coverage threshold)"

[tasks.test-gpu]
run = "pytest packages --run-gpu --cov=voicepad --cov=voicepad_core --cov-fail-under=80"
description = "Run all tests including GPU tests (requires CUDA, 80% coverage threshold)"
