[tools]
python = "3.13"
uv = "latest"
pre-commit = "latest"
markdownlint-cli2 = "latest"

[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["python"]

[hooks]
enter = [
  "bash ./scripts/enter_project.sh",
  "pwsh -File ./scripts/enter_project.ps1",
]

[env]
UV_LINK_MODE = "copy"

[tasks.docs]
run = "uv run zensical serve"
description = "Serve the documentation locally"
