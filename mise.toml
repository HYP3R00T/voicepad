[tools]
python = "3.13"
uv = "latest"
prek = "latest"
markdownlint-cli2 = "latest"
git-cliff = "latest"

[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["python"]

[hooks]
enter = [
  "bash ./scripts/enter_project.sh",
  "pwsh -File ./scripts/enter_project.ps1",
]

[env]
_.file = '.env'       # for sensitive data
UV_LINK_MODE = "copy"

[tasks.docs]
run = "zensical serve"
description = "Serve the documentation locally"

[tasks.sync]
run = "uv sync --upgrade"
description = "Sync dependencies"

[tasks.test]
run = "pytest packages --cov=voicepad --cov=voicepad_core --cov-fail-under=80"
description = "Run pytest with >=80% full package coverage gate (includes GPU tests)"

[tasks.test-fast]
run = "pytest packages -m 'not gpu' --cov=voicepad --cov=voicepad_core --cov-fail-under=80"
description = "Run pytest skipping GPU tests — safe for CI without a GPU"
