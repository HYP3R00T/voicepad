name: Release Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package"
        required: true
        type: choice
        options:
          - voicepad-core
          - voicepad
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - stable
          - alpha
          - beta
          - rc
          - post
          - dev

concurrency:
  group: release-packages
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare, check, and merge release PR
    runs-on: ubuntu-latest
    permissions:
      actions: write # Authorize required CI for the exact generated PR head.
      contents: write # Push the release branch and perform its normal merge.
      pull-requests: write # Create and merge the generated release PR.
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      package: ${{ steps.release.outputs.package }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Require a main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "Releases must be dispatched from main, not $DISPATCH_REF"
            exit 1
          }

      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require the current main head
        env:
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          test "$DISPATCH_SHA" = "$MAIN_SHA" || {
            echo "main advanced from $DISPATCH_SHA to $MAIN_SHA; start a new release run"
            exit 1
          }

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"

      - name: Install changelog tooling
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: true

      - name: Bump package version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            voicepad-core|voicepad) ;;
            *) echo "Unsupported package: $PACKAGE"; exit 1 ;;
          esac
          case "$BUMP" in
            patch|minor|major|stable|alpha|beta|rc|post|dev) ;;
            *) echo "Unsupported bump: $BUMP"; exit 1 ;;
          esac

          (
            cd "packages/$PACKAGE"
            uv version --bump "$BUMP" --no-sync
          )
          VERSION=$(cd "packages/$PACKAGE" && uv version --short)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]
          PRERELEASE=false
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+|\.dev[0-9]+ ]]; then
            PRERELEASE=true
          fi
          {
            echo "branch=release/$PACKAGE-v$VERSION"
            echo "package=$PACKAGE"
            echo "prerelease=$PRERELEASE"
            echo "tag=$PACKAGE-v$VERSION"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Generate package changelog
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          PREVIOUS_TAG=$(git tag --list "$PACKAGE-v*" --sort=-version:refname | head -n 1)
          RANGE=()
          if test -n "$PREVIOUS_TAG"; then
            RANGE=("$PREVIOUS_TAG..HEAD")
          fi
          git cliff \
            --include-path "packages/$PACKAGE/**" \
            --tag-pattern "$PACKAGE-v*" \
            --tag "$TAG" \
            "${RANGE[@]}" \
            --output "packages/$PACKAGE/CHANGELOG.md"

      - name: Update lock and export files
        run: |
          uv lock
          uv export --frozen --quiet --output-file=requirements.txt

      - name: Build before repository mutation
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: uv build --out-dir "$RUNNER_TEMP/release-dist" "packages/$PACKAGE"

      - name: Create or reuse release PR
        id: release_pr
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mapfile -t FILES < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for FILE in "${FILES[@]}"; do
            case "$FILE" in
              "packages/$PACKAGE/CHANGELOG.md"|"packages/$PACKAGE/pyproject.toml"|requirements.txt|uv.lock) ;;
              *) echo "Unexpected release file: $FILE"; exit 1 ;;
            esac
          done
          printf '%s\n' "${FILES[@]}" | grep -Fx "packages/$PACKAGE/CHANGELOG.md"
          printf '%s\n' "${FILES[@]}" | grep -Fx "packages/$PACKAGE/pyproject.toml"
          git diff --check
          git add -- "${FILES[@]}"
          EXPECTED_TREE=$(git write-tree)

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)

          if test -n "$REMOTE_SHA"; then
            mapfile -t PR_NUMBERS < <(gh pr list --base main --head "$BRANCH" --state open \
              --json number --jq '.[].number')
            test "${#PR_NUMBERS[@]}" -eq 1 || {
              echo "Expected one open PR for existing release branch $BRANCH"
              exit 1
            }
            PR_NUMBER=${PR_NUMBERS[0]}
            PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            test "$PR_HEAD" = "$REMOTE_SHA" || {
              echo "PR #$PR_NUMBER does not point to $REMOTE_SHA"
              exit 1
            }

            git reset --hard "$DISPATCH_SHA"
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            git merge --no-commit --no-ff "$DISPATCH_SHA"
            ACTUAL_TREE=$(git write-tree)
            test "$ACTUAL_TREE" = "$EXPECTED_TREE" || {
              echo "Existing release PR does not match a fresh $PACKAGE v$VERSION preparation"
              exit 1
            }
            if git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
              git commit -m "chore(release): update $PACKAGE v$VERSION"
              git push origin "HEAD:refs/heads/$BRANCH"
            fi
          else
            git switch -c "$BRANCH"
            git commit -m "chore(release): $PACKAGE v$VERSION"
            git push --set-upstream origin "$BRANCH"

            BODY="$RUNNER_TEMP/release-pr.md"
            printf '%s\n' \
              '## Package release' \
              '' \
              "- Package: \`$PACKAGE\`" \
              "- Version: \`$VERSION\`" \
              '' \
              'This PR was generated by **Release Packages**. Required CI must pass before the workflow performs a normal merge and publishes the reviewed merge commit.' \
              > "$BODY"
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): $PACKAGE v$VERSION" \
              --body-file "$BODY")
            PR_NUMBER=${PR_URL##*/}
          fi

          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Authorize and wait for required PR CI
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          FOUND=false
          AUTHORIZED_RUN_ID=
          for _ATTEMPT in {1..150}; do
            CHECKS=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs")
            CHECK_COUNT=$(jq -r --argjson pr "$PR_NUMBER" '
              [.check_runs[] | select(
                .name == "CI (uv)" and
                any(.pull_requests[]?; .number == $pr)
              )] | length
            ' <<< "$CHECKS")
            if test "$CHECK_COUNT" -gt 0; then
              FOUND=true
              break
            fi

            RUNS=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch="$BRANCH" -f event=pull_request -f per_page=20)
            RUN_ID=$(jq -r --arg sha "$HEAD_SHA" --argjson pr "$PR_NUMBER" '
              [.workflow_runs[] | select(
                .head_sha == $sha and
                .event == "pull_request" and
                .conclusion == "action_required" and
                any(.pull_requests[]?; .number == $pr)
              )] | first | .id // empty
            ' <<< "$RUNS")
            if test -n "$RUN_ID" && test "$RUN_ID" != "$AUTHORIZED_RUN_ID"; then
              echo "Authorizing CI run $RUN_ID for PR #$PR_NUMBER at $HEAD_SHA"
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/approve"
              AUTHORIZED_RUN_ID=$RUN_ID
            fi
            sleep 2
          done
          test "$FOUND" = true || {
            echo "CI (uv) was not registered for PR #$PR_NUMBER at $HEAD_SHA"
            exit 1
          }
          gh pr checks "$PR_NUMBER" --required --watch --interval 10
          CHECKS=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs")
          CONCLUSION=$(jq -r --argjson pr "$PR_NUMBER" '
            [.check_runs[] | select(
              .name == "CI (uv)" and
              any(.pull_requests[]?; .number == $pr)
            )] | sort_by(.started_at) | last | .conclusion
          ' <<< "$CHECKS")
          test "$CONCLUSION" = success

      - name: Merge through normal branch protection
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$HEAD_SHA"
          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit,state \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid')
          test -n "$MERGE_SHA"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Tag and publish reviewed merge
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the package tag and create its GitHub release.

    steps:
      - name: Checkout reviewed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.merge_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.1"

      - name: Build reviewed package
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
        run: uv build --out-dir "$RUNNER_TEMP/release-dist" "packages/$PACKAGE"

      - name: Create or validate package tag
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
          PACKAGE: ${{ needs.prepare.outputs.package }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh auth setup-git
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$MERGE_SHA" || {
              echo "Tag $TAG points to a different commit"
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$PACKAGE v$VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          uv publish \
            --check-url https://pypi.org/simple \
            "$RUNNER_TEMP"/release-dist/*.whl \
            "$RUNNER_TEMP"/release-dist/*.tar.gz

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.prepare.outputs.package }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists: $TAG"
            exit 0
          fi
          ARGS=()
          if test "$PRERELEASE" = true; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$PACKAGE v$VERSION" \
            --notes-file "packages/$PACKAGE/CHANGELOG.md" \
            "${ARGS[@]}"
