[project]
site_name = "VoicePad"
site_description = "Local voice recording and GPU-accelerated transcription. Private by design. Your audio never leaves your machine."
repo_name = "HYP3R00T/voicepad"
repo_url = "https://github.com/HYP3R00T/voicepad"
site_author = "Rajesh Das"
copyright = "Copyright &copy; 2026 Rajesh Das"
dev_addr = "localhost:3000"

nav = [
  { Home = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "User Interface" = "interface.md" },
  { Configuration = [
    { "Overview" = "configuration/index.md" },
    { "Transcription Models" = "configuration/models.md" },
    { "Input Device" = "configuration/input-device.md" },
    { "Global Hotkey" = "configuration/global-hotkey.md" },
    { "Output Paths" = "configuration/output-paths.md" },
    { "GPU Acceleration" = "configuration/gpu.md" },
  ] },
  { Architecture = [
    { "Transcription Pipeline" = "designs/transcription-pipeline.md" },
  ] },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
scheme = "default"
palette.accent = "teal"
palette.primary = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
palette.accent = "teal"
palette.primary = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/mic"
previous = "lucide/arrow-left"
next = "lucide/arrow-right"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.keys]
