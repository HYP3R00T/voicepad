[project]
site_name = "Voicepad"
site_description = "Voice recording and GPU-accelerated transcription tool."
repo_name = "HYP3R00T/voicepad"
repo_url = "https://github.com/HYP3R00T/voicepad"
site_author = "Rajesh Das"
copyright = "Copyright &copy; 2026 Rajesh Das"
dev_addr = "localhost:3000"

nav = [
    { Home = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { Configuration = "configuration.md" },

    { Features = [
        { Overview = "features/index.md" },
        { "VAD Chunking" = "features/vad-chunking.md" },
        { "Background Transcription" = "features/background-transcription.md" },
    ] },

    { "CLI Reference" = [
        { Overview = "cli/index.md" },
        { "record commands" = "cli/record.md" },
        { "config commands" = "cli/config.md" },
    ] },

    { "Configuration Reference" = [
        { Overview = "reference/index.md" },
    ] },

    { Guides = [
        { Overview = "guides/index.md" },
    ] },

    { Packages = [
        { Overview = "packages/index.md" },
        { "voicepad CLI" = "packages/voicepad/index.md" },
        { "voicepad-core" = [
            { Overview = "packages/voicepad-core/index.md" },
            { "GPU Acceleration" = [
                { Overview = "packages/voicepad-core/gpu-acceleration/index.md" },
                { "Quick Start" = "packages/voicepad-core/gpu-acceleration/quick-start.md" },
                { Troubleshooting = "packages/voicepad-core/gpu-acceleration/troubleshooting.md" },
                { Advanced = "packages/voicepad-core/gpu-acceleration/advanced.md" },
            ] },
        ] },
    ] },

    { Development = "dev/writing-documentation.md" },
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/folder-git-2"
previous = "lucide/arrow-left"
next = "lucide/arrow-right"

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
