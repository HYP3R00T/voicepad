[project]
name = "voicepad"
version = "0.1.0"
description = "Voice recording and GPU-accelerated transcription tool"
readme = "README.md"
authors = [{ name = "hyperoot", email = "rajesh@hyperoot.dev" }]
requires-python = ">=3.12"
dependencies = [
    "textual>=0.40.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.13.0",
    "utilityhub-config>=0.1.1",
    "zensical>=0.0.15",
    "typer>=0.21.1",
    "silero-vad>=6.2.0",
    "torch",
    "torchaudio",
    "faster-whisper>=1.2.1",
    "beaupy>=3.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]

[project.scripts]
voicepad = "voicepad.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.14.10", "textual-dev>=1.8.0", "ty>=0.0.7"]
