[project]
name = "voicepad-workspace"
version = "0.1.0"
description = "Voice recording and GPU-accelerated transcription tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["voicepad", "voicepad-core"]

[tool.uv.workspace]
members = ["packages/voicepad-core", "packages/voicepad"]

[tool.uv.sources]
voicepad = { workspace = true }
voicepad-core = { workspace = true }

[tool.uv]
find-links = ["https://k2-fsa.github.io/sherpa/onnx/cuda.html"]
# Keep Faster-Whisper's transitive CPU runtime off Windows, where VoicePad
# installs the CUDA-enabled distribution instead.
override-dependencies = [
  "onnxruntime>=1.26.0,<1.27.0; sys_platform != 'win32' or platform_machine != 'AMD64'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.1",
  "ty>=0.0.17",
  "zensical>=0.0.23",
  "prek>=0.3.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "gpu: marks tests that require a CUDA GPU. Skipped by default — pass --run-gpu to include.",
  "display: marks tests that require a graphical display (X11/Wayland). Skipped in headless CI.",
]
